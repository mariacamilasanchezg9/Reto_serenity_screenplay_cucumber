# Configuracion del motor de Cucumber sobre la plataforma JUnit 5.
#
# Los runners ya definen glue, plugins y tags; aqui quedan las opciones
# transversales a ambas suites.

# Los nombres de los escenarios se muestran tal cual estan escritos en el .feature.
cucumber.junit-platform.naming-strategy=long

# Falla la ejecucion si un paso del .feature no tiene step definition asociado,
# en lugar de reportarlo como "pendiente" y dar una falsa sensacion de exito.
cucumber.execution.strict=true
