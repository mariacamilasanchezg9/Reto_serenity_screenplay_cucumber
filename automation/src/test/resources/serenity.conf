# ===========================================================================
#  Configuracion central de Serenity BDD.
#
#  Que hace : define el navegador, las URLs del sistema bajo pruebas y el
#             comportamiento del reporte.
#  Para que : ninguna clase Java tiene URLs ni rutas "quemadas"; cambiar de
#             ambiente es cambiar una linea o pasar -Denvironment=<nombre>.
# ===========================================================================

serenity {
  project.name = "Reto Serenity Screenplay Cucumber - Autenticacion"
  # Captura de evidencias: solo para pasos fallidos (reportes mas livianos).
  take.screenshots = FOR_FAILURES
  # Los pasos se muestran en el reporte con el nombre del actor de Screenplay.
  report.show.step.details = true
  console.colors = true
}

# ---------------------------------------------------------------------------
# Navegador usado por la suite WEB.
# Selenium Manager (incluido en Selenium 4) descarga el driver de Chrome
# automaticamente: no hay que instalar chromedriver a mano.
# ---------------------------------------------------------------------------
webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 3000
    fluentwait = 10000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "disable-infobars",
        "disable-gpu",
        "disable-dev-shm-usage",
        "no-sandbox",
        "remote-allow-origins=*",
        "incognito"
      ]
    }
  }
}

# Ejecucion sin ventana visible. Activar con: gradlew webTests -Dheadless.mode=true
headless.mode = false

# ---------------------------------------------------------------------------
# Ambientes. Se selecciona con -Denvironment=<nombre>; por defecto usa "local".
# ---------------------------------------------------------------------------
environments {
  default {
    webdriver.base.url = "http://localhost:8080"
    restapi.baseurl = "http://localhost:8080"
  }
  local {
    webdriver.base.url = "http://localhost:8080"
    restapi.baseurl = "http://localhost:8080"
  }
  # Plantilla para apuntar a un ambiente desplegado.
  qa {
    webdriver.base.url = "http://qa.miempresa.com"
    restapi.baseurl = "http://qa.miempresa.com"
  }
}
